<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#c62828">
<title>尾羽急電鉄 ルーレット</title>
<style>
:root{--red:#1769c2;--dark:#0e4f96;--soft:#edf5ff;--ink:#242424;--muted:#66788a;--line:#e2eaf3}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
main{width:min(760px,calc(100% - 32px));margin:auto;padding:38px 0 48px}
.eyebrow{color:var(--red);font-size:11px;font-weight:800;letter-spacing:.14em}
h1{font-size:clamp(27px,5vw,38px);line-height:1.25;margin:10px 0 8px;letter-spacing:-.04em}
.subtitle{color:var(--muted);margin:0 0 28px;font-size:14px}
.panel{border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 28px #0000000b}
.label{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.08em;margin-bottom:12px}
.results{display:grid;gap:12px}
.card{border:1px solid var(--line);border-radius:13px;padding:15px 16px;min-width:0}
.card.primary{background:var(--soft);border-color:#c4dcf8}
.small{font-size:12px;color:var(--muted);margin-bottom:7px}
.value{font-size:22px;font-weight:800;overflow-wrap:anywhere}
.placeholder{color:#b5b5b5;font-weight:600}
button{width:100%;border:0;border-radius:12px;padding:16px 20px;background:var(--red);color:white;font-size:16px;font-weight:800;cursor:pointer;margin-top:20px;box-shadow:0 5px 0 var(--dark)}
button:hover{background:#1259a6}button:active{transform:translateY(3px);box-shadow:0 2px 0 var(--dark)}button:disabled{opacity:.7;cursor:wait}
.note{font-size:12px;line-height:1.7;color:var(--muted);text-align:center;margin:16px 0 0}
.status{min-height:1.4em;margin-top:12px;text-align:center;color:var(--red);font-size:13px;font-weight:700}
footer{color:#aaa;font-size:10px;text-align:center;margin-top:24px;letter-spacing:.08em}
@media(min-width:560px){.results{grid-template-columns:repeat(3,minmax(0,1fr))}.card.primary{grid-column:1/-1}.card.primary .value{font-size:clamp(22px,4vw,30px)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<div class="eyebrow">OBAKYU RAILWAY · RANDOM ROUTE</div>
<h1>尾羽急電鉄 ルーレット</h1>
<p class="subtitle">種別・経由・行き先を抽選して、運行列車を決定します。</p>
<section class="panel" aria-live="polite">
<div class="label">抽選結果</div>
<div class="results">
<div class="card primary"><div class="small">運行列車</div><div id="result" class="value placeholder">ボタンを押してルーレットを回す</div></div>
<div class="card"><div class="small">① 種別</div><div id="type" class="value placeholder">—</div></div>
<div class="card"><div class="small">② 経由</div><div id="route" class="value placeholder">—</div></div>
<div class="card"><div class="small">③ 行き先</div><div id="destination" class="value placeholder">—</div></div>
</div>
<button id="draw" type="button">ルーレットを回す</button>
<div id="status" class="status" role="status"></div>
<p class="note">種別・経由・行き先をそれぞれランダムに抽選します。<br>抽選時間は約3秒です。</p>
</section>
<footer>OBAKYU RAILWAY · RANDOM ROUTE GENERATOR</footer>
</main>
<script>
"use strict";
const choices={
 type:["各駅停車","快速","準急","区間急行","急行","エアポート急行","快速急行","ノンストップ"],
 route:["尾羽急本線","尾羽急高速線","尾羽支線","空港線","金田線","箱倉支線","井問線","千鳥支線","飛岡支線","飛金線"],
 destination:["尾羽原","井口","梅郷","雲中","安越","十川真砂橋","千峰","南雲谷","雲谷","長峰","西高徳","高徳","明神前","舞子台","紀田","穂","瀬舞","余美","千鳥","問屋町","問屋蔵前","赤堀大沢","赤堀","新赤堀","塚野","金田","百鳥","西百鳥","支線尾羽","北尾羽","新高徳","高徳整備場北","高徳空港","鵲橋","金田市","金田空港","金田新都心","新箱倉金田","南箱倉","上井口","参田町","東本郷","本郷","西問屋町","本郷神宮前","千鳥山道","奥千鳥","南千鳥","水橋","飛岡","垂岡","飛水竜田","南竜田","大原","新塚","飛水柏原","上金田","赤堀アリーナ","科学研究所跡"]
};
const typeEl=document.getElementById("type"),routeEl=document.getElementById("route"),destinationEl=document.getElementById("destination"),resultEl=document.getElementById("result"),statusEl=document.getElementById("status"),button=document.getElementById("draw");
const pick=a=>a[Math.floor(Math.random()*a.length)];
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
button.addEventListener("click",async()=>{
 button.disabled=true;
 [typeEl,routeEl,destinationEl,resultEl].forEach(el=>el.classList.remove("placeholder"));
 statusEl.textContent="列車を抽選中…";
 const start=performance.now(),duration=3000;
 while(performance.now()-start<duration){
  const type=pick(choices.type),route=pick(choices.route),destination=pick(choices.destination);
  typeEl.textContent=type;routeEl.textContent=route;destinationEl.textContent=destination;
  resultEl.textContent=`${type} ${route}経由 ${destination}行き`;
  await wait(70);
 }
 const type=pick(choices.type),route=pick(choices.route),destination=pick(choices.destination);
 typeEl.textContent=type;routeEl.textContent=route;destinationEl.textContent=destination;
 resultEl.textContent=`${type} ${route}経由 ${destination}行き`;
 statusEl.textContent="抽選完了。よい旅を！";
 button.disabled=false;
});
</script>
</body>
</html>
